title: "Sailing Naturali — Engineering"
tagline: "Building the AI ops stack for an all-electric charter catamaran"
description: >-
  Engineering notes from building the boat-agent / marine-AI-ops stack behind
  Sailing Naturali — Home Assistant, SignalK, MCP servers, local LLMs, and NMEA
  marine data. Non-obvious fixes, the dead-ends, and the terse solutions.
url: "https://engineering.sailingnaturali.com"
baseurl: ""

# Pretty, SEO-friendly URLs that preserve the searchable slug (error strings etc.)
permalink: /:title/

theme: minima

# String (not a mapping) — minima 2.5.1 prints site.author verbatim in the footer.
author: "Sailing Naturali"

# Footer social links — rendered by our own _includes/social.html (minima 2.5.1's
# built-in social.html is keyed by *_username and has no website/TikTok support).
# Keep in sync (incl. order) with the canonical list: sailingnaturali/.github → socials.json
social_links:
  - { name: "YouTube",            url: "https://www.youtube.com/@sailingnaturali", icon: youtube }
  - { name: "Substack",           url: "https://sailingnaturali.substack.com",     icon: substack }
  - { name: "sailingnaturali.com", url: "https://sailingnaturali.com",            icon: website }
  - { name: "Instagram",          url: "https://www.instagram.com/sailingnaturali", icon: instagram }
  - { name: "TikTok",             url: "https://www.tiktok.com/@sailingnaturali",  icon: tiktok }

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# Show the post list on the home page
show_excerpts: true

# Markdown / syntax highlighting
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .jekyll-cache
  - docs
