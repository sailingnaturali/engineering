<svg xmlns="http://www.w3.org/2000/svg" width="880" height="392"
     viewBox="0 0 880 392" role="img"
     aria-label="A failure-mode grid: the hard lane still fires when the agent gateway is wedged, the model API is down, the gateway token is broken, or the billing has lapsed, while the soft lane is silent in all four cases; both lanes are silent only when SignalK is down or the internet is gone."
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="880" height="392" rx="10" fill="#0E1B25"/>

  <text x="32" y="42" font-size="18" fill="#E9EEF2" font-weight="600">Which lane still fires when a component is down</text>

  <text x="32" y="76" font-size="13" fill="#7F97A8">FAILURE</text>
  <text x="470" y="76" font-size="13" fill="#7F97A8">HARD LANE — siren</text>
  <text x="686" y="76" font-size="13" fill="#7F97A8">SOFT LANE — agent</text>
  <line x1="32" y1="88" x2="848" y2="88" stroke="#24384A" stroke-width="1"/>

  <rect x="24" y="96" width="832" height="40" rx="6" fill="#11212D"/>
  <text x="32" y="122" font-size="15" fill="#C8D2DA">Agent gateway wedged or restarting</text>
  <text x="470" y="122" font-size="15" fill="#88B868">✓ fires</text>
  <text x="686" y="122" font-size="15" fill="#C86A5A">✕ silent</text>

  <text x="32" y="166" font-size="15" fill="#C8D2DA">Model API down or rate-limited</text>
  <text x="470" y="166" font-size="15" fill="#88B868">✓ fires</text>
  <text x="686" y="166" font-size="15" fill="#C86A5A">✕ silent</text>

  <rect x="24" y="184" width="832" height="40" rx="6" fill="#11212D"/>
  <text x="32" y="210" font-size="15" fill="#C8D2DA">Gateway config or hook token broken</text>
  <text x="470" y="210" font-size="15" fill="#88B868">✓ fires</text>
  <text x="686" y="210" font-size="15" fill="#C86A5A">✕ silent</text>

  <text x="32" y="254" font-size="15" fill="#C8D2DA">Model-provider account or billing lapsed</text>
  <text x="470" y="254" font-size="15" fill="#88B868">✓ fires</text>
  <text x="686" y="254" font-size="15" fill="#C86A5A">✕ silent</text>

  <rect x="24" y="272" width="832" height="40" rx="6" fill="#11212D"/>
  <text x="32" y="298" font-size="15" fill="#C8D2DA">SignalK server down</text>
  <text x="470" y="298" font-size="15" fill="#C86A5A">✕ silent</text>
  <text x="686" y="298" font-size="15" fill="#C86A5A">✕ silent</text>

  <text x="32" y="342" font-size="15" fill="#C8D2DA">No internet</text>
  <text x="470" y="342" font-size="15" fill="#C86A5A">✕ silent</text>
  <text x="686" y="342" font-size="15" fill="#C86A5A">✕ silent</text>

  <line x1="32" y1="358" x2="848" y2="358" stroke="#24384A" stroke-width="1"/>
  <text x="32" y="378" font-size="13" fill="#7F97A8">Hard lane needs 3 things: SignalK, the router plugin, the internet. Soft lane needs those plus a gateway, a model API and a paid account.</text>
</svg>
