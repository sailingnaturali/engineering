<svg xmlns="http://www.w3.org/2000/svg" width="880" height="530"
     viewBox="0 0 880 530" role="img"
     aria-label="Sorting the same 133-station NOAA currents bundle by codepoint compare versus localeCompare hands the clean hale-passage-current URL to two different stations, because the slug ladder gives each rung to whichever station the sort order reaches first.">
  <rect width="880" height="530" rx="10" fill="#0E1B25"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="40" font-size="18" font-weight="600" fill="#E9EEF2">Same data, same ladder — the sort order decides who gets the clean URL</text>
    <text x="40" y="63" font-size="14" fill="#7F97A8">Three bundled NOAA current stations named &#8220;Hale Passage&#8221;, distinguished only by the qualifier.</text>

    <!-- ladder strip -->
    <text x="40" y="96" font-size="14" fill="#C8D2DA">The ladder: each station takes the first rung nobody has claimed yet — checked in sort order.</text>
  </g>

  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
    <rect x="40" y="108" width="190" height="46" rx="6" fill="#11212D" stroke="#24384A"/>
    <text x="52" y="127" font-size="13" fill="#7F97A8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">rung 1</text>
    <text x="52" y="145" font-size="13" fill="#C8D2DA">hale-passage</text>

    <rect x="240" y="108" width="190" height="46" rx="6" fill="#11212D" stroke="#24384A"/>
    <text x="252" y="127" font-size="13" fill="#7F97A8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">rung 2</text>
    <text x="252" y="145" font-size="13" fill="#C8D2DA">hale-passage-current</text>

    <rect x="440" y="108" width="190" height="46" rx="6" fill="#11212D" stroke="#24384A"/>
    <text x="452" y="127" font-size="13" fill="#7F97A8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">rung 3</text>
    <text x="452" y="145" font-size="13" fill="#C8D2DA">...-plus-qualifier</text>

    <rect x="640" y="108" width="190" height="46" rx="6" fill="#11212D" stroke="#24384A"/>
    <text x="652" y="127" font-size="13" fill="#7F97A8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">rung 4</text>
    <text x="652" y="145" font-size="13" fill="#C8D2DA">hale-passage-pug1530</text>
  </g>

  <!-- LEFT PANEL: codepoint -->
  <rect x="40" y="178" width="390" height="292" rx="8" fill="#11212D" stroke="#24384A"/>
  <text x="56" y="204" font-size="15" font-weight="600" fill="#88B868"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Codepoint order</text>
  <text x="56" y="224" font-size="13" fill="#7F97A8"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">a.name &lt; b.name</text>

  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5">
    <text x="56" y="258" fill="#7F97A8">PUG1529</text>
    <text x="118" y="258" fill="#C8D2DA">Hale Passage, East end</text>
    <text x="70" y="278" fill="#88B868">&#8594; hale-passage</text>

    <text x="56" y="322" fill="#7F97A8">PUG1530</text>
    <text x="118" y="322" fill="#C8D2DA">Hale Passage, West end</text>
    <text x="70" y="342" fill="#C86A5A">&#8594; hale-passage-current</text>

    <text x="56" y="386" fill="#7F97A8">PUG1710</text>
    <text x="118" y="386" fill="#C8D2DA">Hale Passage, east of ...</text>
    <text x="70" y="406" fill="#C86A5A">&#8594; hale-passage-east-of-...</text>
  </g>
  <text x="56" y="444" font-size="13" fill="#7F97A8"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">&#8216;W&#8217; (0x57) sorts before &#8216;e&#8217; (0x65)</text>

  <!-- RIGHT PANEL: localeCompare -->
  <rect x="450" y="178" width="390" height="292" rx="8" fill="#11212D" stroke="#24384A"/>
  <text x="466" y="204" font-size="15" font-weight="600" fill="#5888A8"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Collation order</text>
  <text x="466" y="224" font-size="13" fill="#7F97A8"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">a.name.localeCompare(b.name)</text>

  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5">
    <text x="466" y="258" fill="#7F97A8">PUG1529</text>
    <text x="528" y="258" fill="#C8D2DA">Hale Passage, East end</text>
    <text x="480" y="278" fill="#88B868">&#8594; hale-passage</text>

    <text x="466" y="322" fill="#7F97A8">PUG1710</text>
    <text x="528" y="322" fill="#C8D2DA">Hale Passage, east of ...</text>
    <text x="480" y="342" fill="#C86A5A">&#8594; hale-passage-current</text>

    <text x="466" y="386" fill="#7F97A8">PUG1530</text>
    <text x="528" y="386" fill="#C8D2DA">Hale Passage, West end</text>
    <text x="480" y="406" fill="#C86A5A">&#8594; hale-passage-west-end</text>
  </g>
  <text x="466" y="444" font-size="13" fill="#7F97A8"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">case folds first: &#8216;east&#8217; before &#8216;West&#8217;</text>

  <!-- swap marker -->
  <text x="437" y="332" font-size="20" font-weight="700" fill="#C86A5A" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">&#10005;</text>
  <text x="437" y="356" font-size="11" fill="#C86A5A" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">swap</text>

  <text x="40" y="500" font-size="14" fill="#C8D2DA"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Both are correct sorts of the same bundle. Only one of them can be the permanent public URL.</text>
  <text x="40" y="519" font-size="13" fill="#7F97A8"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Three name groups flipped this way across the bundle: Hale Passage, Pickering Passage, The Narrows.</text>
</svg>
