<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500"
     viewBox="0 0 880 500" role="img"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
     aria-label="Offline tide and current data is one public-domain call on the NOAA side, while the licensed Canadian CHS side takes three stages: chs-constituents resolves the CHS station id at runtime under the operator's own IWLS licence, the published station-corrections registry carries no provider id at all, and consumers correlate to live data by station name.">
  <rect width="880" height="500" rx="10" fill="#0E1B25"/>
  <defs>
    <marker id="tipNeutral" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5888A8"/>
    </marker>
    <marker id="tipGood" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#88B868"/>
    </marker>
    <marker id="tipBad" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C86A5A"/>
    </marker>
  </defs>

  <!-- ── US lane ── -->
  <text x="28" y="36" font-size="17" fill="#E9EEF2">US — NOAA: public domain, one call</text>
  <g fill="#11212D" stroke="#24384A">
    <rect x="28" y="54" width="230" height="54" rx="8"/>
    <rect x="294" y="54" width="180" height="54" rx="8"/>
    <rect x="510" y="54" width="150" height="54" rx="8"/>
  </g>
  <g font-size="14.5" fill="#C8D2DA" text-anchor="middle">
    <text x="143" y="86">NOAA endpoint</text>
    <text x="384" y="86">bundle it</text>
    <text x="585" y="86">ship it</text>
  </g>
  <g stroke="#5888A8" stroke-width="2" marker-end="url(#tipNeutral)">
    <line x1="258" y1="81" x2="286" y2="81"/>
    <line x1="474" y1="81" x2="502" y2="81"/>
  </g>
  <text x="28" y="136" font-size="13.5" fill="#7F97A8">Public-domain data: fetch it, bundle it, redistribute it. Nothing to design around.</text>

  <line x1="28" y1="160" x2="852" y2="160" stroke="#24384A"/>

  <!-- ── Canada lane ── -->
  <text x="28" y="192" font-size="17" fill="#E9EEF2">Canada — CHS: licensed, three stages</text>

  <rect x="44" y="206" width="216" height="34" rx="17" fill="#11212D" stroke="#5888A8"/>
  <text x="152" y="228" font-size="13.5" fill="#C8D2DA" text-anchor="middle">CHS IWLS API — licensed</text>

  <!-- allowed: runtime resolution on the operator's own box -->
  <line x1="152" y1="240" x2="152" y2="286" stroke="#88B868" stroke-width="2"
        marker-end="url(#tipGood)"/>
  <g font-size="13.5" fill="#88B868">
    <text x="168" y="258">runtime fetch, under the</text>
    <text x="168" y="274">operator's own licence</text>
  </g>

  <!-- forbidden: the handle entering the published package -->
  <path d="M260 223 H341" stroke="#C86A5A" stroke-width="2" fill="none" stroke-dasharray="6 5"/>
  <path d="M359 223 H440 V286" stroke="#C86A5A" stroke-width="2" fill="none"
        stroke-dasharray="6 5" marker-end="url(#tipBad)"/>
  <g stroke="#C86A5A" stroke-width="2.5" stroke-linecap="round">
    <line x1="344" y1="217" x2="356" y2="229"/>
    <line x1="356" y1="217" x2="344" y2="229"/>
  </g>
  <g font-size="13.5" fill="#C86A5A">
    <text x="452" y="250">never redistributed — the CHS id</text>
    <text x="452" y="266">never enters the published package</text>
  </g>

  <g fill="#11212D" stroke="#24384A">
    <rect x="28" y="292" width="248" height="150" rx="8"/>
    <rect x="316" y="292" width="248" height="150" rx="8"/>
    <rect x="604" y="292" width="248" height="150" rx="8"/>
  </g>
  <g stroke="#88B868" stroke-width="2" marker-end="url(#tipGood)">
    <line x1="276" y1="367" x2="306" y2="367"/>
    <line x1="564" y1="367" x2="594" y2="367"/>
  </g>

  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14.5" fill="#E9EEF2">
    <text x="44" y="318">chs-constituents</text>
    <text x="332" y="318">station-corrections</text>
    <text x="620" y="318">currents-mcp + consumers</text>
  </g>
  <g font-size="13.5" fill="#C8D2DA">
    <text x="44" y="344">Fits harmonic constituents</text>
    <text x="44" y="362">live from CHS predictions.</text>
    <text x="44" y="380">Gets the CHS station id at</text>
    <text x="44" y="398">RUNTIME, under the operator's</text>
    <text x="44" y="416">own IWLS licence. Publishes</text>
    <text x="44" y="434">nothing CHS-derived, ever.</text>

    <text x="332" y="344">The licence-clean identity</text>
    <text x="332" y="362">layer: name, context,</text>
    <text x="332" y="380">position, provider.</text>
    <text x="332" y="398">NO provider id. Join key =</text>
    <text x="332" y="416">the station name / slug.</text>
    <text x="332" y="434">(the published npm package)</text>

    <text x="620" y="344">Correlate a registry record</text>
    <text x="620" y="362">to live CHS data BY NAME.</text>
    <text x="620" y="380">Serve slack windows and</text>
    <text x="620" y="398">transit times.</text>
    <text x="620" y="416">Never sees the CHS handle.</text>
  </g>

  <g font-size="13.5" fill="#7F97A8" text-anchor="middle">
    <text x="152" y="466">the licensed handle lives here,</text>
    <text x="152" y="483">at runtime, on the operator's box</text>
    <text x="440" y="466">nothing here is a copy</text>
    <text x="440" y="483">of CHS's file</text>
    <text x="728" y="466">joins on the station name —</text>
    <text x="728" y="483">a fact anyone may publish</text>
  </g>
</svg>
