<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470"
     viewBox="0 0 880 470" role="img"
     aria-label="The same pmtiles byte-range read gets 206 Partial Content from the static host on a first visit and a plain 200 with the full body from the Workbox precache on every return visit, which is what makes pmtiles throw.">
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7F97A8"/>
    </marker>
    <marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C86A5A"/>
    </marker>
  </defs>
  <rect width="880" height="470" rx="10" fill="#0E1B25"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">

    <text x="32" y="36" font-size="19" fill="#E9EEF2">One byte-range read, two different answers</text>

    <text x="32" y="72" font-size="15" fill="#88B868">First visit — no service worker in the path</text>
    <text x="464" y="72" font-size="15" fill="#C86A5A">Every return visit — the service worker controls the page</text>

    <!-- Column A -->
    <rect x="32" y="88" width="384" height="64" rx="8" fill="#11212D" stroke="#24384A"/>
    <text x="48" y="113" font-size="14" fill="#E9EEF2">MapLibre asks pmtiles for a byte range</text>
    <text x="48" y="134" font-size="13" fill="#C8D2DA" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">Range: bytes=0-16383</text>
    <line x1="224" y1="152" x2="224" y2="176" stroke="#7F97A8" stroke-width="2" marker-end="url(#ok)"/>

    <rect x="32" y="180" width="384" height="64" rx="8" fill="#11212D" stroke="#24384A"/>
    <text x="48" y="205" font-size="14" fill="#E9EEF2">Straight to the static host</text>
    <text x="48" y="226" font-size="13" fill="#C8D2DA">no service worker is intercepting yet</text>
    <line x1="224" y1="244" x2="224" y2="268" stroke="#7F97A8" stroke-width="2" marker-end="url(#ok)"/>

    <rect x="32" y="272" width="384" height="64" rx="8" fill="#11212D" stroke="#88B868"/>
    <text x="48" y="297" font-size="14" fill="#88B868">206 Partial Content</text>
    <text x="48" y="318" font-size="13" fill="#C8D2DA" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">Content-Range: bytes 0-16383/4784128</text>
    <line x1="224" y1="336" x2="224" y2="360" stroke="#7F97A8" stroke-width="2" marker-end="url(#ok)"/>

    <rect x="32" y="364" width="384" height="78" rx="8" fill="#11212D" stroke="#88B868"/>
    <text x="48" y="392" font-size="14" fill="#88B868">Map renders</text>
    <text x="48" y="414" font-size="13" fill="#C8D2DA">The Salish Sea land layer draws.</text>
    <text x="48" y="433" font-size="13" fill="#C8D2DA">Looks shipped.</text>

    <!-- Column B -->
    <rect x="464" y="88" width="384" height="64" rx="8" fill="#11212D" stroke="#24384A"/>
    <text x="480" y="113" font-size="14" fill="#E9EEF2">MapLibre asks pmtiles for a byte range</text>
    <text x="480" y="134" font-size="13" fill="#C8D2DA" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">Range: bytes=0-16383</text>
    <line x1="656" y1="152" x2="656" y2="176" stroke="#7F97A8" stroke-width="2" marker-end="url(#ok)"/>

    <rect x="464" y="180" width="384" height="64" rx="8" fill="#11212D" stroke="#24384A"/>
    <text x="480" y="205" font-size="14" fill="#E9EEF2">Workbox precache answers it</text>
    <text x="480" y="226" font-size="13" fill="#C8D2DA">from the Cache API — the Range header is ignored</text>
    <line x1="656" y1="244" x2="656" y2="268" stroke="#7F97A8" stroke-width="2" marker-end="url(#bad)"/>

    <rect x="464" y="272" width="384" height="64" rx="8" fill="#11212D" stroke="#C86A5A"/>
    <text x="480" y="297" font-size="14" fill="#C86A5A">200 OK</text>
    <text x="480" y="318" font-size="13" fill="#C8D2DA">full 4.78 MB body, no Content-Range</text>
    <line x1="656" y1="336" x2="656" y2="360" stroke="#C86A5A" stroke-width="2" marker-end="url(#bad)"/>

    <rect x="464" y="364" width="384" height="78" rx="8" fill="#11212D" stroke="#C86A5A"/>
    <text x="480" y="392" font-size="14" fill="#C86A5A">&#10007; pmtiles throws — no coastline</text>
    <text x="480" y="414" font-size="13" fill="#C8D2DA" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">Server returned no content-length header</text>
    <text x="480" y="433" font-size="13" fill="#C8D2DA" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">or content-length exceeding request.</text>
  </g>
</svg>
