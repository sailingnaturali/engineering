  <text x="32" y="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#C8D2DA">A tool schema is written once and read from cache; every curl payload lands in the transcript and is re-read on every later turn.</text>
