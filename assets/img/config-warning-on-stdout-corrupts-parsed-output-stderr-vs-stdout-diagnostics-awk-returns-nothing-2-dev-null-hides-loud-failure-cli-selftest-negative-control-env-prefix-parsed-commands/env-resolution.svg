<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350"
     viewBox="0 0 880 350" role="img"
     aria-label="Before the fix only the launcher script sourced the secrets file, so a bare CLI invocation loaded nothing and printed config warnings to stdout; after renaming the file to the dotenv path the CLI auto-loads it on every invocation, every path resolves both credentials and the wrapper's reason to exist disappears.">
  <defs>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7F97A8"/>
    </marker>
  </defs>
  <rect width="880" height="350" rx="10" fill="#0E1B25"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">

    <text x="24" y="34" font-size="18" fill="#E9EEF2" font-weight="600">The fix that deleted the wrapper: name the file the CLI already loads</text>

    <!-- BEFORE panel -->
    <rect x="24" y="52" width="400" height="254" rx="10" fill="#11212D" stroke="#24384A"/>
    <text x="44" y="80" font-size="15" fill="#E9EEF2" font-weight="600">Before — one consumer is wired</text>

    <rect x="64" y="94" width="320" height="40" rx="8" fill="#0E1B25" stroke="#24384A"/>
    <text x="80" y="119" font-size="14" fill="#C8D2DA">config holds two secret references</text>

    <line x1="224" y1="134" x2="152" y2="164" stroke="#7F97A8" stroke-width="2" marker-end="url(#ah2)"/>
    <line x1="224" y1="134" x2="300" y2="164" stroke="#7F97A8" stroke-width="2" marker-end="url(#ah2)"/>

    <rect x="44" y="170" width="176" height="76" rx="8" fill="#0E1B25" stroke="#88B868" stroke-width="2"/>
    <text x="58" y="194" font-size="14" fill="#E9EEF2">launcher script</text>
    <text x="58" y="214" font-size="13" fill="#C8D2DA">sources secrets.env</text>
    <text x="58" y="234" font-size="13" fill="#88B868">both resolve ✓</text>

    <rect x="228" y="170" width="176" height="76" rx="8" fill="#0E1B25" stroke="#C86A5A" stroke-width="2"/>
    <text x="242" y="194" font-size="14" fill="#E9EEF2">bare CLI, any shell</text>
    <text x="242" y="214" font-size="13" fill="#C8D2DA">loads nothing</text>
    <text x="242" y="234" font-size="13" fill="#C86A5A">warnings on stdout ✕</text>

    <text x="44" y="278" font-size="13" fill="#7F97A8">ssh, cron and units all take the right-hand path</text>

    <!-- AFTER panel -->
    <rect x="456" y="52" width="400" height="254" rx="10" fill="#11212D" stroke="#24384A"/>
    <text x="476" y="80" font-size="15" fill="#E9EEF2" font-weight="600">After — the CLI loads it itself</text>

    <rect x="496" y="94" width="320" height="40" rx="8" fill="#0E1B25" stroke="#24384A"/>
    <text x="512" y="119" font-size="14" fill="#C8D2DA">config holds two secret references</text>

    <line x1="656" y1="134" x2="656" y2="164" stroke="#7F97A8" stroke-width="2" marker-end="url(#ah2)"/>

    <rect x="476" y="170" width="360" height="76" rx="8" fill="#0E1B25" stroke="#88B868" stroke-width="2"/>
    <text x="492" y="194" font-size="14" fill="#E9EEF2">every invocation auto-loads the dotenv file</text>
    <text x="492" y="214" font-size="13" fill="#C8D2DA">shell · ssh · cron · service unit · daemon</text>
    <text x="492" y="234" font-size="13" fill="#88B868">both resolve ✓ — no prefix, no wrapper</text>

    <text x="476" y="278" font-size="13" fill="#7F97A8">the launcher stopped sourcing anything at all</text>

    <text x="24" y="332" font-size="13" fill="#7F97A8">The wrapper survives for one unrelated reason: PATH. The binary's directory is only on an interactive shell's PATH.</text>
  </g>
</svg>
