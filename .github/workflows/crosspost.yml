# Cross-post published blog posts to dev.to after the site deploys.
#
# Chained AFTER "Deploy site to Pages" (pages.yml) via workflow_run so the
# canonical URL is already live before dev.to is told about it, and a failed
# build never cross-posts. Create-only + idempotent: re-runs are no-ops.
# The DEVTO_API_KEY secret stays out of the Pages-permissioned deploy job.
#
# dev.to throttles article creation (300s windows, strict for new accounts), so
# a single run only gets a couple through before a 429. The reconcile treats a
# 429 as "done for now" (exits 0, logs what's left); the hourly `schedule` drains
# any backlog a few posts at a time. Steady state (one new post per deploy) is
# handled by the after-deploy run and never trips the limit.
name: Cross-post to dev.to

on:
  workflow_run:
    workflows: ["Deploy site to Pages"]
    types: [completed]
  schedule:
    - cron: "17 * * * *" # hourly drain of any throttled backlog (offset off the hour)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be created without posting"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  crosspost:
    runs-on: ubuntu-latest
    # Manual dispatch and the hourly schedule always allowed; the workflow_run
    # auto-run only after a successful main deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Run tests
        run: ruby -e 'Dir.glob("test/**/*_test.rb").each { |f| require File.expand_path(f) }'
      - name: Cross-post to dev.to
        run: bin/crosspost-devto ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
