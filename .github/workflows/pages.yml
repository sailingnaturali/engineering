# Build and deploy the Jekyll site to GitHub Pages via Actions.
#
# Replaces the auto-managed "Deploy from a branch" build, which ran
# actions/checkout + actions/upload-artifact on the deprecated Node 20 runtime.
# Building here lets us pin the actions and lets dependabot (.github/dependabot.yml)
# bump them as GitHub ships Node 24 versions. Still uses the github-pages gem, so
# local `bundle exec jekyll build` matches what CI publishes (see Gemfile).
name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/configure-pages@v6
      - name: Build with Jekyll
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # A failed deploy leaves the live site silently stale — the publish commit is
  # authored by the publisher bot, so GitHub's own workflow-failure email goes
  # nowhere a human reads. File an issue instead; that does notify.
  # (2026-08-06: a hosted-runner outage failed the deploy and the site sat two
  # days behind with nobody aware.)
  notify:
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # ponytail: one issue per failed run, no dedupe — deploy only runs on push
      # to main, so this can't loop. Add a search-and-comment if it gets noisy.
      - run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Pages deploy failed on ${GITHUB_SHA:0:7}" \
            --body "The site did not rebuild, so engineering.sailingnaturali.com is stale.

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Re-run with: \`gh run rerun $GITHUB_RUN_ID --failed\`"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
