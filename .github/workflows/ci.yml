# PR checks: catch a broken post before merge = publish.
#
# Runs the same Jekyll build as pages.yml (github-pages gem, so a green check
# means the deploy will build), the Liquid guard lint (script/lint-liquid.py —
# an unguarded {{ … }} is silently blanked from published code blocks, and some
# constructs are hard Liquid errors that take the deploy down), and the devto
# unit tests (otherwise they only run inside the crosspost workflow, after merge).
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Liquid guard lint
        run: python3 script/lint-liquid.py
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: devto unit tests
        run: ruby -e 'Dir.glob("test/**/*_test.rb").each { |f| require File.expand_path(f) }'
      - name: Build with Jekyll
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
